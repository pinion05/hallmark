  an over-cap waiver does not fall back to silence, it falls back to the gate.

  Assertion (run from this directory):

    node ../../sloplint.mjs . --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify(j.summary))})"
    # expected: fails 2, waived 3, rejected 2
    # (counts are findings, not gates: gate 1 fires on both the token and the h1
    #  rule, and gate 7 on both the token and the body background)

  Case by case:
    waive 40  → refused, Floor is never waivable
    waive 7   → honoured; the guard (surface: absolute in the stamp) holds
    waive 22  → honoured
    waive 25  → honoured (no finding to downgrade here); fills the three-gate cap
    waive 1   → refused on the cap, and gate 1 then fails on its own merits
-->
